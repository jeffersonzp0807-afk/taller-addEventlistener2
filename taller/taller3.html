<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 3: El mayor de 3 numeros</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller El mayor de 3 numeros</h1>
        <p>Ingrese 3 numeros y descubra cual es el mayor</p>
    </header>

    <main>
        <form id="formTaller3" novalidate>
            <label for="numero1">Número 1:</label>
            <input type="number" id="numero1" step="any">
            <label for="numero2">Número 2:</label>
            <input type="number" id="numero2" step="any">
            <label for="numero3">Número 3:</label>
            <input type="number" id="numero3" step="any">

            <div class="botones">
                <input type="submit" value="Ordenar">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller3.js"></script>
</body>
</html>
